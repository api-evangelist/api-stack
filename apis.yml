x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    apistack.io is a 213-listing directory website with no developer surface of its own —
    /docs, /api-docs and /pricing all return 404, the 268-URL sitemap contains no developer,
    reference or pricing page, and no /.well-known/ document is served; the one
    machine-readable endpoint on the host, /api/graphql, is the Apideck Ecosystem platform
    backend that apistack.io runs on as a tenant (its schema is Marketplace/Listing/Partner
    plus Unify/Vault/Connection types), is disallowed in robots.txt, and is therefore
    catalogued under Apideck rather than credited to API Stack.
  evidence:
    - url: https://www.apistack.io/docs
      status: 404
    - url: https://www.apistack.io/api-docs
      status: 404
    - url: https://www.apistack.io/pricing
      status: 404
    - url: https://www.apistack.io/.well-known/api-catalog
      status: 404
    - url: https://www.apistack.io/sitemap.xml
      status: 200
    - url: https://www.apistack.io/api/graphql
      status: 200
