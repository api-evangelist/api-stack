contract_discovery:
  ran: '2026-09-02'
  outcome: >-
    One machine-readable endpoint exists on the API Stack host, and it is NOT API Stack's
    API. It is recorded here as evidence rather than saved as an api-stack contract.
  finding:
    endpoint: https://www.apistack.io/api/graphql
    method: 'POST {"query":"{__schema{queryType{name}}}"}'
    http_status: 200
    introspection: open
    schema_size: '308 types, Query with 66 fields, Mutation with 109 fields'
    ownership_verdict: not-api-stack
    ownership_reasoning: >-
      Judged by what the schema says about itself, not by where it was fetched. The type
      set is the Apideck platform - UnifyAccount, Connection, Consumer, Vault Session,
      UnifiedApi, Webhook, Application, TargetFieldMapping - alongside the Apideck
      Ecosystem marketplace types (Marketplace, Listing, Partner, Collection, Product).
      apistack.io is itself a tenant of Apideck Ecosystem ("powered by Apideck"), so this
      is the multi-tenant platform backend answering under the tenant's Next.js /api route,
      exactly the shared-codebase case STEP 0c warns about. Saving it here would credit the
      API Stack directory with Apideck's platform API. Its correct home is all/apideck.
    also_seen:
      - endpoint: https://www.apistack.io/api/get-services
        http_status: 200
        note: >-
          Thin Next.js proxy that returns catalog.apideck.com/api/cloud-services verbatim
          (18,247 services, Apideck's own links[] in the payload). Apideck's catalog API,
          not API Stack's.
    robots: 'both /api routes are Disallow: /api in https://www.apistack.io/robots.txt'
