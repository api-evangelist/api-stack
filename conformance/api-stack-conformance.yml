  conformance rows below are all recorded as not-applicable rather than false. What CAN be
  asserted from probes is the web-discovery surface the directory does serve. The
  contract_discovery block records the one machine-readable endpoint found on the host and
  why it is NOT attributed to API Stack.
domain_standard:
